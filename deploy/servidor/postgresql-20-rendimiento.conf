# /etc/postgresql/18/main/conf.d/20-rendimiento.conf
# Portal Escolar — ajuste para VPS de 8 GB RAM / 2 CPU (Hostinger KVM 2).
# Si el servidor cambia de tamaño, recalcular: shared_buffers ≈ 25 % de la RAM y
# effective_cache_size ≈ 75 %. Requiere reiniciar PostgreSQL.
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB
max_connections = 100
