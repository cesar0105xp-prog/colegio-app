# /etc/nginx/snippets/cabeceras-seguridad.conf — cabeceras de seguridad del Portal Escolar.
# Se incluye en el bloque server y OTRA VEZ en cada location que tenga su propio
# add_header: en Nginx un add_header dentro de un location anula todos los heredados.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
