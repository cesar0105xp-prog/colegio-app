# /etc/systemd/system/pm2-portal.service.d/override.conf
# Portal Escolar — arranque fiable de PM2.
# La unidad generada por `pm2 startup` es Type=forking con PIDFile, pero PM2
# escribe pm2.pid un instante después de que `pm2 resurrect` termina: systemd
# no lo encuentra, marca el arranque como fallido ("protocol") y reintenta hasta
# rendirse, así que tras un reinicio del servidor el portal podía no levantar.
# Como oneshot + RemainAfterExit el servicio queda activo en cuanto `resurrect`
# termina; los procesos siguen en el cgroup de la unidad y `stop` los detiene.
[Unit]
Wants=network-online.target
After=network-online.target postgresql.service

[Service]
Type=oneshot
RemainAfterExit=yes
PIDFile=
Restart=no
