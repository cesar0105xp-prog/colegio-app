# Nginx — Portal Escolar (VPS todo-en-uno)
# Sirve el build de React desde /var/www/portal y reenvía /api al backend Node (PM2, puerto 3001).
# setup-vps.sh reemplaza "portal.DOMINIO" por el dominio real y lo instala en
# /etc/nginx/sites-available/portal. Certbot añade después el bloque HTTPS (443)
# y la redirección de HTTP a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name portal.DOMINIO;

    root /var/www/portal;
    index index.html;

    # Comprobantes/documentos: el backend acepta hasta 10 MB (MAX_FILE_SIZE_MB).
    client_max_body_size 12m;

    # API → backend Node
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    # Assets con hash en el nombre: cache larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html siempre se revalida: así, tras cada despliegue, recargar la
    # página trae la versión nueva. Sin esta cabecera el navegador puede
    # reutilizar una copia vieja que apunta al código anterior. Las rutas del
    # SPA también pasan por aquí (try_files hace una redirección interna).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta del frontend (/login, /padre, /acceso-matricula/...) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
