# Nginx — Portal Escolar (VPS todo-en-uno)
# Sirve el build de React desde /var/www/portal y reenvía /api al backend Node (PM2, puerto 3001).
# setup-vps.sh reemplaza "portal.DOMINIO" por el dominio real y lo instala en
# /etc/nginx/sites-available/portal. Certbot añade después el bloque HTTPS (443)
# y la redirección de HTTP a HTTPS; set-domain.sh activa HTTP/2 en ese bloque.
# Requiere /etc/nginx/snippets/cabeceras-seguridad.conf (deploy/servidor/).

server {
    listen 80;
    listen [::]:80;
    server_name portal.DOMINIO;

    root /var/www/portal;
    index index.html;

    # Los archivos pueden pesar hasta 10 MB (MAX_FILE_SIZE_MB); se deja 1 MB de
    # margen porque el envío multipart suma cabeceras y separadores al archivo.
    client_max_body_size 11m;

    include snippets/cabeceras-seguridad.conf;

    # API → backend Node
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # El backend (helmet) también envía estas cabeceras; se ocultan las suyas
        # para que no salgan duplicadas y Nginx sea la única fuente.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Assets con hash en el nombre (JS, CSS, imágenes del build): caché de 30 días
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include snippets/cabeceras-seguridad.conf;
    }

    # index.html siempre se revalida: así, tras cada despliegue, recargar la
    # página trae la versión nueva. Las rutas del SPA también pasan por aquí
    # (try_files hace una redirección interna).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/cabeceras-seguridad.conf;
    }

    # SPA: cualquier ruta del frontend (/login, /padre, /acceso-matricula/...) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
